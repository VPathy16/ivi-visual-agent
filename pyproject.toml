[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ivi-visual-agent"
version = "0.1.0"
description = "A local, goal-driven visual agent for Android IVI testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
docs = ["reportlab>=4.0", "pypdf>=5.0"]
# Optional CLIP backend for matching a live icon crop against manual icons.
# Text semantic retrieval needs no extra dependency (it uses a local Ollama
# embedding model over HTTP).
clip = ["open-clip-torch>=2.20", "torch>=2.0"]

[project.scripts]
ivi-agent = "ivi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
