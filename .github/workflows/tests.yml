name: tests

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test-relevant extras
        # docs -> exercises the manual PDF tests; cv -> exercises the OpenCV
        # fast-path tests. Embedding/CLIP/MCP tests are mocked or import-guarded,
        # so those heavy extras are not needed to run the suite.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs,cv]'

      - name: Run test suite
        run: python -m unittest discover -s tests -v
